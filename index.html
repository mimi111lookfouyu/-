<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>iPhone 17 Pro · 网页手机模拟器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --frame: #bbb8b1;
      --frame-edge: #706f6b;
      --text: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 49%, #28282d 0, #151518 38%, #09090b 76%),
        #09090b;
    }

    button { font: inherit; color: inherit; }

    .stage {
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      perspective: 1300px;
      padding: 26px;
    }

    :fullscreen .stage {
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      padding: 0;
      perspective: none;
    }

    :fullscreen .phone {
      width: 100vw;
      height: 100svh;
      max-height: none;
      min-width: 0;
      aspect-ratio: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #07080e;
      box-shadow: none;
      transform: none;
    }

    :fullscreen .phone::before,
    :fullscreen .side-button,
    :fullscreen .power-button { display: none; }
    :fullscreen .screen { border-radius: 0; }

    .phone {
      position: relative;
      width: min(390px, calc((100svh - 48px) * .462));
      aspect-ratio: 402 / 874;
      min-width: 290px;
      max-height: calc(100svh - 34px);
      padding: 9px;
      border: 1px solid #e8e4d8;
      border-radius: 58px;
      background:
        linear-gradient(118deg, #f8f6ee 0%, #96948e 5%, #e8e5dc 8%, #a9a69f 11%, #cfccc4 48%, #777671 91%, #e3e0d7 96%, #8d8a84 100%);
      box-shadow:
        0 0 0 1px #343431,
        0 0 0 3px #62615c,
        0 34px 100px #000b,
        0 12px 30px #0009,
        inset 0 0 0 1px #fff8;
      transform: rotateX(1deg);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 3px;
      border-radius: 55px;
      border: 1px solid #fff3;
      pointer-events: none;
    }

    .side-button {
      position: absolute;
      z-index: 1;
      width: 3px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(90deg, #565550, #dedbd2, #777670);
      left: -4px;
      box-shadow: -1px 0 1px #fff5;
    }
    .action-button { top: 134px; height: 29px; }
    .volume-up { top: 190px; height: 53px; }
    .volume-down { top: 258px; height: 53px; }
    .power-button {
      position: absolute;
      z-index: 1;
      width: 3px;
      height: 81px;
      right: -4px;
      top: 210px;
      border-radius: 0 5px 5px 0;
      background: linear-gradient(90deg, #e1ded5, #65645f, #a7a49d);
    }

    .screen {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 49px;
      background: #07080e;
      box-shadow: inset 0 0 0 1px #000;
      touch-action: manipulation;
    }

    .wallpaper {
      position: absolute;
      z-index: -2;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 53% 44%, #f6a0ad 0%, #de6486 16%, #a42b71 34%, transparent 58%),
        radial-gradient(ellipse at 79% 26%, #66d8e6 0%, #158aab 18%, transparent 45%),
        radial-gradient(ellipse at 24% 76%, #e9b64d 0%, #c24e37 19%, transparent 50%),
        linear-gradient(146deg, #111e3c 3%, #172d4a 36%, #432251 67%, #081427 100%);
      filter: saturate(1.09);
      transition: filter .6s ease, transform .8s ease;
    }

    .wallpaper::before, .wallpaper::after {
      content: "";
      position: absolute;
      width: 120%;
      height: 55%;
      left: -10%;
      top: 32%;
      border-radius: 50%;
      filter: blur(26px);
      transform: rotate(-24deg);
      background: linear-gradient(90deg, transparent, #ffcc8966 24%, #ff8492b5 45%, #6df4e9a1 70%, transparent);
    }
    .wallpaper::after {
      top: 52%;
      left: -18%;
      transform: rotate(25deg);
      opacity: .8;
      filter: blur(44px);
      background: linear-gradient(90deg, transparent, #f783a4c9 32%, #ffc86c99 63%, transparent);
    }

    .screen::after {
      content: "";
      position: absolute;
      z-index: 8;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg, #fff1 0%, transparent 23%, transparent 76%, #0002);
      border-radius: inherit;
    }

    .tianzi-screen-crack {
      position: absolute;
      z-index: 14;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
      mix-blend-mode: screen;
      animation: tianzi-crack-flash .5s ease-out both;
    }
    .tianzi-screen-crack img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: .94;
    }
    @keyframes tianzi-crack-flash {
      0% { opacity: 0; }
      25% { opacity: 1; }
      100% { opacity: .94; }
    }

    .status-bar {
      position: absolute;
      z-index: 12;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      padding: 14px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.3px;
      text-shadow: 0 1px 5px #0007;
      pointer-events: none;
    }

    .status-right { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
    .status-right svg { display: block; }
    .status-right button { pointer-events: auto; }
    .fullscreen-toggle {
      width: 25px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .wu-album-picker { position: absolute; z-index: 4; right: 8px; bottom: calc(100% - 5px); left: 8px; max-height: 45vh; overflow: auto; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 6px; padding: 8px; border: 1px solid #e1e4e2; border-radius: 12px 12px 0 0; background: #f7f8f7; box-shadow: 0 -4px 14px #00000012; }
    .wu-album-photo { position: relative; overflow: hidden; padding: 0; border: 0; border-radius: 8px; background: #e6e8e7; cursor: pointer; }
    .wu-album-photo img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .wu-album-photo span { position: absolute; right: 3px; bottom: 3px; left: 3px; overflow: hidden; padding: 2px 3px; border-radius: 4px; background: #0008; color: #fff; font-size: 9px; text-align: left; text-overflow: ellipsis; white-space: nowrap; }

    .island {
      position: absolute;
      z-index: 15;
      top: 11px;
      left: 50%;
      width: 124px;
      height: 36px;
      transform: translateX(-50%);
      border-radius: 24px;
      background: #000;
      box-shadow: 0 0 0 1px #ffffff08;
      transition: width .35s ease, height .35s ease, top .35s ease;
      cursor: pointer;
    }
    .island.expanded { width: 250px; height: 74px; top: 10px; }
    .camera-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      right: 12px;
      top: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #26384b, #07090d 72%);
      box-shadow: inset 0 0 0 1px #19202c;
      transition: opacity .2s;
    }
    .island.expanded .camera-dot { opacity: 0; }
    .island-content { display: none; }
    .island.expanded .island-content {
      display: flex;
      height: 100%;
      padding: 12px 17px;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #ddd;
    }
    .island-art { font-size: 24px; }
    .island-wave { color: #9c79ed; letter-spacing: 2px; font-size: 15px; }

    .view {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.025);
      transition: opacity .24s ease, transform .3s ease, visibility .24s;
    }
    .view.active { opacity: 1; visibility: visible; transform: scale(1); }

    .tianzi-phone-lock {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #000;
      color: #f5f5f7;
      text-align: center;
    }
    .tianzi-phone-lock h2 { margin: 0 0 18px; font-size: 24px; font-weight: 600; }
    .tianzi-phone-lock p { margin: 10px 0; color: #c7c7cc; font-size: 15px; line-height: 1.6; }
    .tianzi-phone-lock .tianzi-lock-ending { margin-top: 40px; color: #77777d; font-size: 12px; }

    .lock-screen {
      text-align: center;
      padding-top: 88px;
      cursor: pointer;
    }
    .lock-date { font-size: 16px; font-weight: 550; letter-spacing: .2px; }
    .lock-clock {
      margin-top: 1px;
      font-size: clamp(74px, 23vw, 102px);
      line-height: 1.12;
      font-weight: 300;
      letter-spacing: -7px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 24px #0002;
    }
    .lock-widgets {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin: 12px auto 0;
    }
    .weather-widget {
      width: 144px;
      height: 63px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #17192b51;
      backdrop-filter: blur(18px);
      font-size: 12px;
      text-align: left;
      box-shadow: inset 0 0 0 1px #ffffff0d;
    }
    .weather-icon { font-size: 27px; }
    .weather-temp { font-size: 22px; font-weight: 500; }
    .lock-hint {
      position: absolute;
      bottom: 94px;
      width: 100%;
      font-size: 13px;
      color: #ffffffce;
      text-shadow: 0 1px 8px #000;
      animation: hint 2s ease-in-out infinite;
    }
    @keyframes hint { 50% { opacity: .58; } }
    .lock-controls {
      position: absolute;
      bottom: 35px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
    }
    .round-control {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid #ffffff3b;
      background: #16172060;
      backdrop-filter: blur(14px);
      cursor: pointer;
      font-size: 20px;
      transition: background .2s, transform .2s;
    }
    .round-control:hover { background: #ffffff35; transform: scale(1.07); }

    .home-screen { padding: 70px 20px 34px; }
    .home-pages {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }
    .home-page {
      position: absolute;
      inset: 0;
      width: 100%;
      transform: translateX(100%);
      transition: transform .32s cubic-bezier(.22,.75,.25,1);
    }
    .home-page.active { transform: translateX(0); }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: 13px;
      row-gap: 21px;
    }
    .app-button {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-shadow: 0 1px 6px #0009;
      transition: transform .18s ease;
    }
    .app-button:active { transform: scale(.88); }
    .app-icon {
      width: 57px;
      height: 57px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 4px 11px #0005, inset 0 0 0 1px #ffffff19;
      font-size: 29px;
      text-shadow: none;
      position: relative;
    }
    .app-name { width: 67px; font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .calendar-icon { background: #f8f8fb; color: #202027; font-size: 10px; font-weight: 700; }
    .calendar-icon b { font-size: 25px; line-height: 24px; color: #e64947; font-weight: 400; }
    .photos-icon { background: #fff; font-size: 31px; }
    .camera-icon { background: linear-gradient(145deg, #515663, #18191c); font-size: 31px; }
    .maps-icon { background: linear-gradient(140deg, #bce7bc, #fff 47%, #f3d9b2); }
    .clock-icon { background: #121319; font-size: 32px; border: 2px solid #303139; }
    .weather-icon-app { background: linear-gradient(145deg, #61bafa, #4776d5); }
    .settings-icon { background: linear-gradient(145deg, #c8cbd1, #727780); }
    .store-icon { background: linear-gradient(145deg, #4db5ff, #2663ce); }
    .notes-icon { background: linear-gradient(#fff 0 27%, #ffdf57 27% 100%); color: #333; font-size: 27px; }
    .health-icon { background: #fff; color: #f05462; font-size: 33px; }
    .wallet-icon { background: linear-gradient(145deg, #424a56, #161a21); }
    .wuliao-icon { background: linear-gradient(145deg, #a4f0ce, #43c890); font-size: 32px; }
    .home-indicator {
      position: absolute;
      z-index: 18;
      bottom: 8px;
      left: 50%;
      width: 135px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      transition: width .2s, background .2s;
    }
    .home-indicator:hover { width: 145px; }
    .page-dots {
      position: absolute;
      z-index: 2;
      bottom: 101px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .page-dot {
      width: 6px;
      height: 6px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #ffffff80;
      cursor: pointer;
    }
    .page-dot.active { background: #fff; }
    .dock {
      position: absolute;
      bottom: 24px;
      left: 13px;
      right: 13px;
      height: 82px;
      padding: 10px 12px;
      border-radius: 27px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      background: #ffffff27;
      backdrop-filter: blur(26px) saturate(1.5);
      box-shadow: inset 0 0 0 1px #ffffff20;
    }
    .dock .app-button { gap: 0; }
    .dock .app-icon { width: 56px; height: 56px; }
    .dock .app-name { display: none; }
    .badge {
      position: absolute;
      top: -4px;
      right: calc(50% - 33px);
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      border: 1.5px solid #f5f5f7;
      border-radius: 10px;
      background: #ff3b30;
      color: white;
      font-size: 10px;
      text-shadow: none;
    }

    .app-view {
      position: absolute;
      z-index: 10;
      inset: 0;
      background: #f5f5f7;
      color: #111;
      transform: translateY(105%);
      transition: transform .42s cubic-bezier(.22,.8,.25,1);
      overflow: auto;
      scrollbar-width: none;
    }
    .app-view::-webkit-scrollbar { display: none; }
    .app-view.open { transform: translateY(0); }
    .store-page { padding: 12px 14px 24px; background: #f5f5f7; color: #111; }
    .store-header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
    .store-header h2 { margin: 0; font-size: 22px; }
    .store-search { height: 38px; border: 1px solid #dfe2ea; border-radius: 16px; background: #eef1f7; padding: 0 12px; font-size: 14px; }
    .store-hint { font-size: 12px; color: #6f7786; margin: 12px 0 8px; }
    .store-card { background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(246,246,250,.92)); border-radius: 24px; box-shadow: inset 0 0 0 1px rgba(16,16,20,.05); padding: 16px 14px; margin-bottom: 12px; }
    .store-featured { padding: 16px 14px; background: linear-gradient(135deg, #f6f6ff, #ebf5ff); }
    .store-featured-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .store-badge { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg,#ff8a58,#ff5d7a); color: #fff; font-weight: 700; }
    .store-app-list { display: grid; gap: 10px; }
    .store-app-row { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px; background: rgba(255,255,255,.8); border-radius: 18px; padding: 10px 12px; box-shadow: inset 0 0 0 1px rgba(17,17,17,.04); }
    .store-app-icon { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(145deg, #fcdd7a, #f7b22a); font-size: 24px; font-weight: 700; color: #4a2d00; }
    .store-app-copy { display: flex; flex-direction: column; min-width: 0; }
    .store-app-copy strong { font-size: 15px; }
    .store-app-copy span { font-size: 11px; color: #7a7d85; }
    .store-install-button { min-width: 78px; height: 32px; border-radius: 999px; border: 0; background: linear-gradient(135deg,#2d7ffa,#195ee3); color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
    .store-install-button:disabled { background: #d8dbe3; color: #8e95a2; cursor: not-allowed; }
    .store-download-status { color: #6a7a94; font-size: 11px; }
    .store-modal-mask { position: absolute; inset: 0; background: rgba(12,13,16,.38); display: grid; place-items: center; z-index: 40; }
    .store-modal-card { width: min(260px, 82vw); background: rgba(255,255,255,.96); border-radius: 24px; padding: 18px 16px 16px; text-align: center; color: #1f2430; box-shadow: 0 24px 48px rgba(14,16,21,.35); }
    .store-modal-card h4 { margin: 0 0 8px; font-size: 18px; }
    .store-modal-card p { margin: 0; font-size: 13px; color: #545d6b; }
    .photo-saved-overlay { position: absolute; z-index: 42; inset: 0; display: grid; place-items: center; background: #10101545; animation: photo-saved-in .18s ease-out; }
    .photo-saved-card { min-width: 190px; padding: 19px 22px; border-radius: 18px; background: #fffffff2; color: #28292e; text-align: center; box-shadow: 0 12px 34px #0003; }
    .photo-saved-icon { width: 40px; height: 40px; margin: 0 auto 9px; display: grid; place-items: center; border-radius: 50%; background: #e6f7ec; color: #28a45d; font-size: 24px; }
    .photo-saved-card strong { display: block; font-size: 14px; }
    .photo-saved-card span { display: block; margin-top: 5px; color: #85868c; font-size: 10px; }
    @keyframes photo-saved-in { from { opacity: 0; } to { opacity: 1; } }
    .xhs-page { min-height: 100%; padding: 8px 13px 30px; background: #f7f7f7; color: #252525; }
    .xhs-topbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; margin: -8px -13px 8px; padding: 10px 14px; background: #ffffffed; backdrop-filter: blur(14px); }
    .xhs-brand { color: #ff2442; font-size: 20px; font-weight: 850; }
    .xhs-feed-tabs { display: flex; justify-content: center; gap: 25px; color: #777; font-size: 13px; }
    .xhs-feed-tabs strong { position: relative; color: #222; }
    .xhs-feed-tabs strong::after { position: absolute; right: 8px; bottom: -7px; left: 8px; height: 3px; border-radius: 3px; background: #ff2442; content: ""; }
    .xhs-feed { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; align-items: start; }
    .xhs-post-card { min-width: 0; overflow: hidden; border-radius: 10px; background: #fff; box-shadow: 0 1px 5px #0000000c; }
    button.xhs-post-card { padding: 0; border: 0; color: inherit; font: inherit; text-align: left; }
    .xhs-post-card.openable { cursor: pointer; }
    .xhs-post-photo { display: block; width: 100%; aspect-ratio: .88; object-fit: cover; background: #eee; }
    .xhs-post-copy { padding: 8px 9px 10px; }
    .xhs-post-title { display: -webkit-box; overflow: hidden; margin: 0; color: #252525; font-size: 12px; font-weight: 650; line-height: 1.48; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .xhs-post-meta { display: flex; align-items: center; gap: 5px; margin-top: 9px; color: #777; font-size: 10px; }

    .xhs-post-likes { margin-left: auto; color: #555; white-space: nowrap; }
    .xhs-detail { min-height: 100%; padding: 0 0 18px; background: #fff; color: #252525; }
    .xhs-detail-nav { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 9px 13px; background: #ffffffed; backdrop-filter: blur(14px); }
    .xhs-back { width: 32px; height: 32px; border: 0; background: transparent; color: #333; font-size: 25px; cursor: pointer; }
    .xhs-author { display: flex; min-width: 0; flex: 1; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; }
    .xhs-follow { padding: 5px 13px; border: 1px solid #ff2442; border-radius: 999px; background: #fff; color: #ff2442; font: inherit; font-size: 11px; }
    .xhs-detail-photo { display: block; width: 100%; max-height: 410px; aspect-ratio: 1 / 1; object-fit: contain; background: #f4f4f4; }
    .xhs-detail-content { padding: 13px 15px 8px; }
    .xhs-detail-title { margin: 0 0 8px; font-size: 18px; line-height: 1.45; }

      function renderMiniGame(body) {
        const assets = ["头像/天子.opt.jpg", "头像/小谷.opt.jpg", "头像/小米.opt.jpg", "头像/消消乐用.opt.jpg"];
        const width = 8;
        const height = 8;
        const luckyAdThreshold = 2000;
        let tiles = [];
        let selectedIndex = -1;
        let moves = 0;
        let score = 0;
        let busy = false;
        let luckyAdShown = false;

        const message = document.createElement("div");
        message.className = "mini-game-message";
        message.setAttribute("role", "status");
        message.textContent = "点击相邻的两张头像交换，连成三个即可消除";
        const board = document.createElement("div");
        board.className = "mini-game-grid";
        board.setAttribute("aria-label", "老吴消消乐棋盘");
        const scoreboard = document.createElement("div");
        scoreboard.className = "mini-game-scoreboard";
        const resetButton = document.createElement("button");
        resetButton.type = "button";
        resetButton.className = "mini-game-reset";
        resetButton.textContent = "重来";

        const randomTile = () => assets[Math.floor(Math.random() * assets.length)];

        function createBoard() {
          tiles = [];
          for (let index = 0; index < width * height; index += 1) {
            let tile = randomTile();
            const row = Math.floor(index / width);
            const column = index % width;
            while (
              (column >= 2 && tiles[index - 1] === tile && tiles[index - 2] === tile) ||
              (row >= 2 && tiles[index - width] === tile && tiles[index - width * 2] === tile)
            ) {
              tile = randomTile();
            }
            tiles.push(tile);
          }
        }

        function updateScoreboard() {
          scoreboard.innerHTML = `<span>分数：${score}</span><span>步数：${moves}</span>`;
        }

        function findMatches() {
          const matches = new Set();
          for (let row = 0; row < height; row += 1) {
            for (let column = 0; column < width; column += 1) {
              const start = row * width + column;
              const tile = tiles[start];
              if (!tile) continue;
              if (column <= width - 3 && tiles[start + 1] === tile && tiles[start + 2] === tile) {
                let end = column + 2;
                while (end + 1 < width && tiles[row * width + end + 1] === tile) end += 1;
                for (let matchColumn = column; matchColumn <= end; matchColumn += 1) {
                  matches.add(row * width + matchColumn);
                }
              }
              if (row <= height - 3 && tiles[start + width] === tile && tiles[start + width * 2] === tile) {
                let end = row + 2;
                while (end + 1 < height && tiles[(end + 1) * width + column] === tile) end += 1;
                for (let matchRow = row; matchRow <= end; matchRow += 1) {
                  matches.add(matchRow * width + column);
                }
              }
            }
          }
          return matches;
        }

        function renderBoard() {
          board.innerHTML = "";
          tiles.forEach((asset, index) => {
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "mini-game-tile" + (index === selectedIndex ? " selected" : "");
            cell.style.backgroundImage = `url("${encodeURI(asset)}")`;
            cell.dataset.index = String(index);
            cell.dataset.asset = asset;
            cell.setAttribute("aria-label", `第${Math.floor(index / width) + 1}行第${index % width + 1}列`);
            cell.addEventListener("click", () => handleTileClick(index));
            board.append(cell);
          });
        }

        function resolveMatches() {
          const matches = findMatches();
          if (matches.size === 0) {
            busy = false;
            return;
          }

          score += matches.size * 10;
          matches.forEach((index) => { tiles[index] = ""; });
          for (let column = 0; column < width; column += 1) {
            const remaining = [];
            for (let row = height - 1; row >= 0; row -= 1) {
              const tile = tiles[row * width + column];
              if (tile) remaining.push(tile);
            }
            for (let row = height - 1; row >= 0; row -= 1) {
              tiles[row * width + column] = remaining[height - 1 - row] || randomTile();
            }
          }
          renderBoard();
          updateScoreboard();
          message.textContent = "消除成功！继续连击吧";
          if (score >= luckyAdThreshold && !luckyAdShown) {
            luckyAdShown = true;
            showLuckyPlayerAd();
          }
          window.setTimeout(resolveMatches, 180);
        }

        function handleTileClick(index) {
          if (busy) return;
          if (selectedIndex < 0) {
            selectedIndex = index;
            renderBoard();
            return;
          }
          if (selectedIndex === index) {
            selectedIndex = -1;
            renderBoard();
            return;
          }
          const rowDistance = Math.abs(Math.floor(selectedIndex / width) - Math.floor(index / width));
          const columnDistance = Math.abs((selectedIndex % width) - (index % width));
          if (rowDistance + columnDistance !== 1) {
            selectedIndex = index;
            renderBoard();
            return;
          }

          const firstIndex = selectedIndex;
          [tiles[firstIndex], tiles[index]] = [tiles[index], tiles[firstIndex]];
          selectedIndex = -1;
          const matches = findMatches();
          if (matches.size === 0) {
            [tiles[firstIndex], tiles[index]] = [tiles[index], tiles[firstIndex]];
            message.textContent = "这步没有连成三个，再试一次";
            renderBoard();
            return;
          }
          moves += 1;
          busy = true;
          message.textContent = "消除中…";
          renderBoard();
          updateScoreboard();
          resolveMatches();
        }

        function restartGame() {
          busy = false;
          selectedIndex = -1;
          moves = 0;
          score = 0;
          luckyAdShown = false;
          createBoard();
          message.textContent = "点击相邻的两张头像交换，连成三个即可消除";
          updateScoreboard();
          renderBoard();
        }

        resetButton.addEventListener("click", restartGame);
        body.innerHTML = `
          <div class="mini-game-shell">
            <div class="mini-game-header">
              <h3>老吴消消乐</h3>
              <button class="mini-game-reset" type="button">重来</button>
            </div>
            <div class="mini-game-message"></div>
            <div class="mini-game-grid" aria-label="老吴消消乐棋盘"></div>
            <div class="mini-game-scoreboard"></div>
          </div>
        `;

        const shell = body.querySelector(".mini-game-shell");
        shell.querySelector(".mini-game-message").replaceWith(message);
        shell.querySelector(".mini-game-grid").replaceWith(board);
        shell.querySelector(".mini-game-reset").replaceWith(resetButton);
        shell.querySelector(".mini-game-scoreboard").replaceWith(scoreboard);
        createBoard();
        updateScoreboard();
        renderBoard();
      }

      function renderSuikaGame(body) {
        const images = suikaImages;
        const shell = document.createElement("div");
        shell.className = "suika-game-shell";
        shell.innerHTML = `<canvas class="suika-game-canvas" aria-label="合成大老吴游戏区域"></canvas><div class="suika-game-hud"><div class="suika-score-card">分数<strong class="suika-score">0</strong></div><div class="suika-next-card">下一个<img class="suika-next-image" alt="下一个素材"></div></div><div class="suika-instruction">点击或轻触投放，两个相同素材碰到后会合成升级</div>`;
        body.replaceChildren(shell);
        const canvas = shell.querySelector("canvas");
        const context = canvas.getContext("2d");
        if (!context) throw new Error("无法创建合成游戏画布");
        const scoreLabel = shell.querySelector(".suika-score");
        const nextImage = shell.querySelector(".suika-next-image");
        const instruction = shell.querySelector(".suika-instruction");
        const assetErrorHandlers = images.map((image, index) => {
          const handleError = () => {
            instruction.textContent = `素材加载失败：${suikaImagePaths[index]}`;
          };
          image.addEventListener("error", handleError);
          if (image.complete && !image.naturalWidth) handleError();
          return handleError;
        });
        const radiusByLevel = [21, 27, 34, 41, 49, 60];
        const fruits = [];
        const confetti = [];
        let score = 0;
        let nextLevel = Math.floor(Math.random() * 2);
        let width = 0;
        let height = 0;
        let gameRafId = 0;
        let confettiRafId = 0;
        let lastFrame = 0;
        let dropReady = true;
        let won = false;
        let lost = false;
        let resizeObserver;

        function setNextImage() {
          nextImage.onerror = () => { nextImage.alt = "素材加载失败"; };
          nextImage.src = images[nextLevel].src;
        }

        function resizeCanvas() {
          const rect = shell.getBoundingClientRect();
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          width = rect.width;
          height = rect.height;
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function fruitRadius(level) {
          return radiusByLevel[level] * Math.min(1, width / 360);
        }

        function spawnFruit(x) {
          if (!dropReady || won || lost) return;
          const radius = fruitRadius(nextLevel);
          fruits.push({ x: Math.max(radius, Math.min(width - radius, x)), y: 30 + radius, vx: 0, vy: 0, level: nextLevel, radius, settled: false });
          nextLevel = Math.floor(Math.random() * 3) === 0 ? 1 : 0;
          setNextImage();
          dropReady = false;
          window.setTimeout(() => { dropReady = true; }, 420);
        }

        function finishGame() {
          if (won) return;
          won = true;
          const overlay = document.createElement("div");
          overlay.className = "suika-won-overlay";
          overlay.setAttribute("role", "dialog");
          overlay.setAttribute("aria-modal", "true");
          overlay.setAttribute("aria-label", "游戏通关");
          overlay.innerHTML = `<canvas class="suika-confetti"></canvas><section class="suika-won-card"><h3>恭喜通关！</h3><p>小婴儿NB666</p><button type="button">继续欣赏</button></section>`;
          shell.append(overlay);
          overlay.querySelector("button").addEventListener("click", () => overlay.remove());
          startConfetti(overlay.querySelector("canvas"));
          const audio = new Audio();
          audio.volume = 0.5;
          audio.src = new URL("老吴音频/天子吴.mp3".split("/").map(encodeURIComponent).join("/"), document.baseURI).href;
          audio.play().catch((error) => {
            const note = document.createElement("p");
            note.textContent = `通关音频无法播放：${error.message || "浏览器拒绝播放"}`;
            overlay.querySelector(".suika-won-card").append(note);
          });
        }

        function startConfetti(confettiCanvas) {
          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          confettiCanvas.width = Math.round(width * ratio);
          confettiCanvas.height = Math.round(height * ratio);
          const ctx = confettiCanvas.getContext("2d");
          if (!ctx) return;
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          const colors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#b66dff", "#ff8fab"];
          for (let index = 0; index < 110; index += 1) {
            confetti.push({ x: Math.random() * width, y: -Math.random() * height, vx: (Math.random() - .5) * 2.4, vy: 1.5 + Math.random() * 3, size: 4 + Math.random() * 6, color: colors[index % colors.length], angle: Math.random() * Math.PI });
          }
          function drawConfetti() {
            if (!overlayIsVisible()) return;
            ctx.clearRect(0, 0, width, height);
            confetti.forEach((piece) => {
              piece.x += piece.vx;
              piece.y += piece.vy;
              piece.angle += .06;
              if (piece.y > height + 10) piece.y = -10;
              ctx.save();
              ctx.translate(piece.x, piece.y);
              ctx.rotate(piece.angle);
              ctx.fillStyle = piece.color;
              ctx.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size * .62);
              ctx.restore();
            });
            confettiRafId = requestAnimationFrame(drawConfetti);
          }
          function overlayIsVisible() { return confettiCanvas.isConnected; }
          drawConfetti();
        }

        function mergePair(firstIndex, secondIndex) {
          const first = fruits[firstIndex];
          const second = fruits[secondIndex];
          if (!first || !second || first.level !== second.level) return false;
          const level = first.level + 1;
          const x = (first.x + second.x) / 2;
          const y = (first.y + second.y) / 2;
          fruits.splice(Math.max(firstIndex, secondIndex), 1);
          fruits.splice(Math.min(firstIndex, secondIndex), 1);
          score += Math.pow(level + 1, 2) * 10;
          scoreLabel.textContent = String(score);
          const radius = fruitRadius(level);
          fruits.push({ x, y, vx: 0, vy: level >= images.length - 1 ? 0 : -1.5, level, radius, settled: level >= images.length - 1 });
          if (level >= images.length - 1) finishGame();
          return true;
        }

        function drawFruit(fruit) {
          context.save();
          context.beginPath();
          context.arc(fruit.x, fruit.y, fruit.radius, 0, Math.PI * 2);
          context.clip();
          const image = images[fruit.level];
          if (image.complete && image.naturalWidth) {
            context.drawImage(image, fruit.x - fruit.radius, fruit.y - fruit.radius, fruit.radius * 2, fruit.radius * 2);
          } else {
            context.fillStyle = "#b9a8ec";
            context.fill();
            context.fillStyle = "#fff";
            context.font = `${Math.max(11, fruit.radius * .7)}px sans-serif`;
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillText("老吴", fruit.x, fruit.y);
          }
          context.restore();
          context.beginPath();
          context.arc(fruit.x, fruit.y, fruit.radius, 0, Math.PI * 2);
          context.strokeStyle = "#ffffffa8";
          context.lineWidth = 2;
          context.stroke();
        }

        function tick(time) {
          if (!shell.isConnected) return;
          const delta = Math.min((time - (lastFrame || time)) / 16.67, 2);
          lastFrame = time;
          context.clearRect(0, 0, width, height);
          context.fillStyle = "#ffffff65";
          context.fillRect(8, 8, width - 16, height - 16);
          context.strokeStyle = "#bfc9ea";
          context.lineWidth = 2;
          context.strokeRect(8, 8, width - 16, height - 16);

          for (let index = fruits.length - 1; index >= 0; index -= 1) {
            const fruit = fruits[index];
            fruit.vy = Math.min(fruit.vy + .24 * delta, 8);
            fruit.x += fruit.vx * delta;
            fruit.y += fruit.vy * delta;
            fruit.vx *= .995;
            if (fruit.x - fruit.radius < 9) { fruit.x = 9 + fruit.radius; fruit.vx *= -.34; }
            if (fruit.x + fruit.radius > width - 9) { fruit.x = width - 9 - fruit.radius; fruit.vx *= -.34; }
            if (fruit.y + fruit.radius > height - 22) {
              fruit.y = height - 22 - fruit.radius;
              fruit.vy *= -.18;
              if (Math.abs(fruit.vy) < .7) { fruit.vy = 0; fruit.settled = true; }
            }
          }

          let merged = false;
          for (let first = 0; first < fruits.length && !merged; first += 1) {
            for (let second = first + 1; second < fruits.length; second += 1) {
              const a = fruits[first];
              const b = fruits[second];
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const distance = Math.hypot(dx, dy) || 0.001;
              const overlap = a.radius + b.radius - distance;
              if (overlap > 0) {
                if (a.level === b.level) {
                  mergePair(first, second);
                  merged = true;
                  break;
                }
                const push = overlap / 2;
                a.x -= dx / distance * push;
                a.y -= dy / distance * push;
                b.x += dx / distance * push;
                b.y += dy / distance * push;
                a.vx -= dx / distance * .12;
                b.vx += dx / distance * .12;
                a.vy = Math.min(a.vy, 1);
                b.vy = Math.min(b.vy, 1);
              }
            }
          }

          fruits.forEach(drawFruit);
          if (!lost && fruits.some((fruit) => fruit.y - fruit.radius < 12 && fruit.settled)) {
            lost = true;
            const hint = document.createElement("div");
            hint.className = "suika-won-overlay";
            hint.innerHTML = `<section class="suika-won-card"><h3>空间满啦</h3><p>点一下继续试试</p><button type="button">重新开始</button></section>`;
            shell.append(hint);
            hint.querySelector("button").addEventListener("click", () => {
              hint.remove();
              fruits.length = 0;
              score = 0;
              scoreLabel.textContent = "0";
              lost = false;
              won = false;
            });
          }
          gameRafId = requestAnimationFrame(tick);
        }

        function dropAt(event) {
          const rect = canvas.getBoundingClientRect();
          spawnFruit(event.clientX - rect.left);
        }

        canvas.addEventListener("pointerdown", dropAt);
        setNextImage();
        resizeCanvas();
        if ("ResizeObserver" in window) {
          resizeObserver = new ResizeObserver(resizeCanvas);
          resizeObserver.observe(shell);
        } else {
          window.addEventListener("resize", resizeCanvas);
        }
        gameRafId = requestAnimationFrame(tick);
        suikaCleanup = () => {
          cancelAnimationFrame(gameRafId);
          cancelAnimationFrame(confettiRafId);
          if (resizeObserver) resizeObserver.disconnect();
          else window.removeEventListener("resize", resizeCanvas);
          canvas.removeEventListener("pointerdown", dropAt);
          images.forEach((image, index) => image.removeEventListener("error", assetErrorHandlers[index]));
          suikaCleanup = null;
        };
      }

          overlay.querySelector(".wu-copy-code").addEventListener("click", async () => {
            const copyStatus = overlay.querySelector(".wu-code-countdown");
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(wuOtp);

                const temporaryInput = document.createElement("textarea");
                temporaryInput.value = wuOtp;
                temporaryInput.setAttribute("readonly", "");
                temporaryInput.style.position = "fixed";
                temporaryInput.style.opacity = "0";
                document.body.append(temporaryInput);
                temporaryInput.select();
                const copied = document.execCommand("copy");
                temporaryInput.remove();

          wuOtp = "";
          renderWuList();
        });
      }

      function pickRandom(items, count) {
        const shuffled = [...items];
        for (let index = shuffled.length - 1; index > 0; index--) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
        }
        return shuffled.slice(0, count);
      }

          const note = document.createElement("div");
          note.className = "wu-transfer-note";
          note.textContent = message.transfer.note;
          details.append(amount, note);
          main.append(icon, details);

          footer.className = "wu-transfer-footer";

          bubble.append(main, footer);
        } else if (message.audioPath) {
          bubble.className = "wu-bubble wu-audio-bubble";
          const playButton = document.createElement("button");
          playButton.className = "wu-audio-button";
          playButton.type = "button";
          playButton.setAttribute("aria-label", "播放语音消息");
          const icon = document.createElement("span");
          icon.className = "wu-audio-icon";
          icon.textContent = "◖";
          const duration = document.createElement("span");
          duration.className = "wu-audio-duration";
          duration.textContent = "…″";
          const audio = document.createElement("audio");
          audio.volume = 0.5;
          audio.preload = "metadata";
          audio.src = new URL(message.audioPath.split("/").map(encodeURIComponent).join("/"), document.baseURI).href;
          audio.addEventListener("error", () => {
            icon.textContent = "!";
            playButton.setAttribute("aria-label", `语音文件无法读取：${audio.error?.message || "请检查音频文件路径"}`);
          });
          audio.addEventListener("loadedmetadata", () => {
            if (Number.isFinite(audio.duration)) {
              const seconds = Math.max(1, Math.ceil(audio.duration));
              duration.textContent = `${seconds}″`;
              bubble.style.setProperty("--wu-audio-width", `${Math.min(190, 72 + seconds * 7)}px`);
              playButton.setAttribute("aria-label", `播放 ${seconds} 秒语音消息`);
            }
          });
          const resetPlayback = () => { icon.textContent = "◖"; };
          audio.addEventListener("ended", resetPlayback);
          audio.addEventListener("pause", resetPlayback);
          playButton.addEventListener("click", () => {
            if (audio.paused) {
              const playback = audio.play();
              if (!playback) {
                icon.textContent = "♫";
                return;
              }
              playback.then(() => {
                icon.textContent = "♫";
                playButton.setAttribute("aria-label", "暂停语音消息");
              }).catch((error) => {
                icon.textContent = "!";
                playButton.setAttribute("aria-label", `语音播放失败：${error.message}`);
              });
            } else {
              audio.pause();
            }
          });
          playButton.append(icon, duration);
          bubble.append(playButton, audio);
        } else if (message.image || message.imagePath || message.imageData) {
          const image = document.createElement("img");
          image.className = "wu-chat-photo";
          image.loading = "lazy";
          image.decoding = "async";
          image.src = encodeURI(message.imageData || message.imagePath || `小清纯照片/${message.image}.opt.jpg`);

          image.loading = "lazy";
          bubble.append(image);
        } else {
          bubble.textContent = message.text;
        }
        row.append(avatar, bubble);
        container.append(row);
      }

      function renderTianziPhoneLock(lockedUntil, resetStory = null) {
        if (wuTianziLockInterval) window.clearInterval(wuTianziLockInterval);
        if (wuTianziTimeTravelTimeout) window.clearTimeout(wuTianziTimeTravelTimeout);
        const overlay = document.createElement("section");
        overlay.className = "tianzi-phone-lock";
        overlay.id = "tianziPhoneLock";
        overlay.setAttribute("role", "status");
        overlay.setAttribute("aria-label", "已被主人上锁");
        overlay.innerHTML = `<div><h2>已被主人上锁</h2><p>需要在1个小时后解锁</p><p id="tianziLockCountdown"></p><p class="tianzi-lock-ending">结局二：是我给你自由过了火</p><button class="wu-auth-button" id="tianziTimeTravel" type="button" hidden>听一遍反方向的钟回到过去</button></div>`;
        $("#screen").append(overlay);
        const countdown = overlay.querySelector("#tianziLockCountdown");
        const timeTravel = overlay.querySelector("#tianziTimeTravel");
        timeTravel.addEventListener("click", () => {
          window.clearInterval(wuTianziLockInterval);
          window.clearTimeout(wuTianziTimeTravelTimeout);
          wuTianziLockInterval = 0;
          wuTianziTimeTravelTimeout = 0;
          localStorage.removeItem(wuTianziLockStorageKey);
          overlay.remove();
          if (resetStory) {
            resetStory();
          } else {
            unlocked = false;
            appView.classList.remove("open");
            homeScreen.classList.remove("active");
            lockScreen.classList.add("active");
          }
        });
        wuTianziTimeTravelTimeout = window.setTimeout(() => {
          if (overlay.isConnected) timeTravel.hidden = false;
        }, 4000);
        const updateLock = () => {
          const remaining = lockedUntil - Date.now();
          if (remaining <= 0) {
            window.clearInterval(wuTianziLockInterval);
            window.clearTimeout(wuTianziTimeTravelTimeout);
            wuTianziLockInterval = 0;
            wuTianziTimeTravelTimeout = 0;
            localStorage.removeItem(wuTianziLockStorageKey);
            overlay.remove();
            unlocked = false;
            appView.classList.remove("open");
            homeScreen.classList.remove("active");
            lockScreen.classList.add("active");
            return;
          }
          const totalSeconds = Math.ceil(remaining / 1000);
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;
          countdown.textContent = `解锁倒计时 ${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        };
        updateLock();
        wuTianziLockInterval = window.setInterval(updateLock, 1000);
      }

      function renderMessages(body) {

          const inbox = $("#smsInbox");
          const shuffledMessages = demoSmsMessages.slice();
          for (let index = shuffledMessages.length - 1; index > 0; index -= 1) {
            const swapIndex = Math.floor(Math.random() * (index + 1));
            [shuffledMessages[index], shuffledMessages[swapIndex]] = [shuffledMessages[swapIndex], shuffledMessages[index]];
          }
          shuffledMessages.forEach((message) => {
            const row = document.createElement("button");

            row.type = "button";
            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.textContent = message.icon;
            const copy = document.createElement("div");
            copy.className = "message-copy";
            const title = document.createElement("b");
            title.textContent = message.sender;
            const time = document.createElement("span");
            time.textContent = message.time;
            time.style.cssText = "float:right;color:#888;font-size:11px";
            title.append(time);
            const preview = document.createElement("span");
            preview.textContent = message.text;
            copy.append(title, preview);

      function deletePhotoAlbumItem(photo) {

            localStorage.setItem(savedPhoneImageStorageKey, JSON.stringify(images.filter((entry) => entry.id !== photo.id)));

            const saved = localStorage.getItem(deletedAlbumPhotoStorageKey);
            const deletedIds = saved ? JSON.parse(saved) : [];
            if (!Array.isArray(deletedIds) || deletedIds.some((id) => typeof id !== "string")) {

      function startDemoCall(body, contact) {
        const playableWuAudioFiles = ["可爱.mp3", "吴老.mp3", "喊饿.mp3", "基米斗.mp3", "天子吴.mp3", "惨叫2.mp3", "痛苦.mp3"];
        const shuffledAudioFiles = [...playableWuAudioFiles];
        for (let index = shuffledAudioFiles.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [shuffledAudioFiles[index], shuffledAudioFiles[randomIndex]] = [shuffledAudioFiles[randomIndex], shuffledAudioFiles[index]];
        }
        const callAudioFiles = shuffledAudioFiles.slice(0, 5);
        const audio = new Audio();
        audio.volume = 0.5;
        audio.preload = "auto";
        let currentAudioIndex = 0;
        let disposed = false;
        const renderCallScreen = (status = "已接通", canHangUp = true) => {
          body.innerHTML = `<section class="phone-call-screen" role="status"><div class="phone-call-avatar">👤</div><h3></h3><p id="phoneCallStatus"></p>${canHangUp ? '<button class="phone-hangup" id="phoneHangup" type="button" aria-label="挂断">☎</button>' : '<button class="phone-call-return" id="phoneCallReturn" type="button">返回联系人</button>'}</section>`;
          body.querySelector("h3").textContent = contact.name;
          $("#phoneCallStatus").textContent = status;
          if (canHangUp) $("#phoneHangup").addEventListener("click", finishCall);
          else $("#phoneCallReturn").addEventListener("click", () => renderPhone(body));
        };
        const removeCall = () => {
          disposed = true;
          audio.pause();
          audio.removeEventListener("ended", onEnded);
          audio.removeEventListener("error", onError);
          audio.removeAttribute("src");
          audio.load();
          if (phoneCallCleanup === removeCall) phoneCallCleanup = null;
        };
        const finishCall = () => {
          if (disposed) return;
          removeCall();
          renderCallScreen("通话结束", false);
        };
        const playNextAudio = () => {
          if (disposed) return;
          if (currentAudioIndex >= callAudioFiles.length) {
            finishCall();
            return;
          }
          const audioFile = callAudioFiles[currentAudioIndex];
          audio.src = new URL(`老吴音频/${audioFile}`.split("/").map(encodeURIComponent).join("/"), document.baseURI).href;
          audio.currentTime = 0;
          audio.play().catch((error) => {
            if (disposed) return;
            if (error.name === "NotAllowedError") {
              const screen = body.querySelector(".phone-call-screen");
              $("#phoneCallStatus").textContent = "点击屏幕继续播放通话音频";
              screen.addEventListener("click", (event) => {
                if (event.target.closest("#phoneHangup")) return;
                $("#phoneCallStatus").textContent = "已接通";
                playNextAudio();
              }, { once: true });
              return;
            }
            console.error("Unable to play the demo phone audio.", error);
            removeCall();
            renderCallScreen("音频无法播放，通话已结束", false);
          });
        };
        const onEnded = () => {
          if (disposed) return;
          currentAudioIndex += 1;
          playNextAudio();
        };
        const onError = () => {
          if (disposed || !audio.error) return;
          console.error("Demo phone audio could not be decoded.", audio.error);
          removeCall();
          renderCallScreen("音频无法播放，通话已结束", false);
        };
        phoneCallCleanup = removeCall;
        audio.addEventListener("ended", onEnded);
        audio.addEventListener("error", onError);
        renderCallScreen();
        playNextAudio();
      }

        const image = body.querySelector(".xingtu-photo");

        function applyAdjustments() {

          body.querySelectorAll(".xingtu-adjustment input").forEach((control) => {

        stage.addEventListener("pointerdown", (event) => {
          const stickerElement = event.target.closest(".xingtu-sticker");
          if (!stickerElement || !event.isPrimary) return;
          event.preventDefault();
          stickerElement.setPointerCapture(event.pointerId);
        });
        stage.addEventListener("pointermove", (event) => {
          const stickerElement = event.target.closest(".xingtu-sticker");
          if (!stickerElement?.hasPointerCapture(event.pointerId)) return;
          const bounds = stage.getBoundingClientRect();
          const halfWidth = stickerElement.offsetWidth / bounds.width * 50;
          const halfHeight = stickerElement.offsetHeight / bounds.height * 50;
          const left = Math.min(100 - halfWidth, Math.max(halfWidth, (event.clientX - bounds.left) / bounds.width * 100));
          const top = Math.min(100 - halfHeight, Math.max(halfHeight, (event.clientY - bounds.top) / bounds.height * 100));
          stickerElement.style.left = `${left}%`;
          stickerElement.style.top = `${top}%`;
        });
        body.querySelectorAll(".xingtu-adjustment input").forEach((control) => control.addEventListener("input", applyAdjustments));

        body.querySelector(".xingtu-export").addEventListener("click", async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          status.textContent = "正在导出修图作品…";
          try {
            if (!image.complete || !image.naturalWidth) throw new Error("照片尚未加载完成。");
            const scale = Math.max(1, image.naturalWidth / stage.clientWidth, image.naturalHeight / stage.clientHeight);
            const canvas = document.createElement("canvas");
            canvas.width = Math.ceil(stage.clientWidth * scale);
            canvas.height = Math.ceil(stage.clientHeight * scale);
            const context = canvas.getContext("2d");
            if (!context) throw new Error("当前浏览器无法创建图片画布。");
            context.scale(scale, scale);
            context.save();
            context.translate(stage.clientWidth / 2, stage.clientHeight / 2);
            context.rotate(rotation * Math.PI / 180);
            context.filter = getComputedStyle(image).filter;
            const imageScale = Math.min(stage.clientWidth / image.naturalWidth, stage.clientHeight / image.naturalHeight);
            const drawWidth = image.naturalWidth * imageScale;
            const drawHeight = image.naturalHeight * imageScale;
            context.drawImage(image, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            context.restore();
            for (const stickerElement of stage.querySelectorAll(".xingtu-sticker")) {
              const svg = stickerElement.querySelector("svg");
              if (!svg) continue;
              const stickerImage = new Image();
              const stickerSvg = svg.cloneNode(true);
              stickerSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
              stickerImage.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(stickerSvg.outerHTML)}`;
              await stickerImage.decode();
              const x = parseFloat(stickerElement.style.left) / 100 * stage.clientWidth;
              const y = parseFloat(stickerElement.style.top) / 100 * stage.clientHeight;
              context.drawImage(stickerImage, x - stickerElement.offsetWidth / 2, y - stickerElement.offsetHeight / 2, stickerElement.offsetWidth, stickerElement.offsetHeight);
            }
            if (!saveXingtuExport(canvas.toDataURL("image/jpeg", .9))) {
              status.textContent = "导出失败：浏览器存储空间不足或不可用";

            console.error("Unable to export edited photo.", error);
            status.textContent = `导出失败：${error.message}`;
          } finally {
            button.disabled = false;
          }
        });
        applyAdjustments();
      }

          body.innerHTML = `<main class="wallet-page"><header class="wallet-topbar"><strong>钱包</strong><span>安全管理　···</span></header><section class="wallet-overview"><div class="wallet-overview-label">私人财富账户</div><div class="wallet-overview-balance">¥ 143,700,000</div><div class="wallet-overview-note">演示余额 · 虚构资产信息</div></section><h3 class="wallet-section-title">银行卡 <span>5 张 · 点击查看卡片</span></h3><section class="wallet-card-list" aria-label="银行卡列表"></section><h3 class="wallet-section-title">车钥匙 <span>数字车钥匙</span></h3><button class="wallet-key-card" type="button" aria-pressed="${vehicleUnlocked}"><span class="wallet-key-icon" aria-hidden="true">⌑</span><span class="wallet-key-copy"><strong>Mercedes-Maybach</strong><span>迈巴赫数字车钥匙 · S 级</span></span><span class="wallet-key-status"></span></button><p class="wallet-demo-note">本地钱包界面演示。卡号均为虚构掩码，不能用于支付；车钥匙按钮仅切换模拟状态，不连接真实车辆。</p></main>`;
          const list = body.querySelector(".wallet-card-list");
          cards.forEach((card, index) => {
            const button = document.createElement("button");
            button.className = "wallet-bank-card";
            button.type = "button";
            button.setAttribute("aria-label", `查看${card.bank}${card.tier}`);
            button.innerHTML = `<span class="wallet-bank-card-name"></span><span class="wallet-bank-card-type"></span><span class="wallet-bank-card-chip" aria-hidden="true"></span><span class="wallet-bank-card-number"></span>`;
            button.style.background = bankCardBackgrounds[index];
            button.querySelector(".wallet-bank-card-name").textContent = card.bank;
            button.querySelector(".wallet-bank-card-type").textContent = card.tier;
            button.querySelector(".wallet-bank-card-number").textContent = `••••　••••　••••　${card.digits}`;
            button.addEventListener("click", () => renderCardDetail(card, index));
            list.append(button);
          });
          const key = body.querySelector(".wallet-key-card");
          const keyStatus = body.querySelector(".wallet-key-status");
          const updateKeyStatus = () => {
            keyStatus.textContent = vehicleUnlocked ? "已解锁　›" : "已上锁　›";
            key.setAttribute("aria-pressed", String(vehicleUnlocked));
          };
          key.addEventListener("click", () => {
            vehicleUnlocked = !vehicleUnlocked;
            updateKeyStatus();
          });
          updateKeyStatus();
        };

        function renderCardDetail(card, index) {
          body.innerHTML = `<main class="wallet-page"><button class="dianping-checkout-back wallet-card-back" type="button">‹ 返回卡包</button><section class="wallet-bank-card" aria-label="银行卡正面"><span class="wallet-bank-card-name"></span><span class="wallet-bank-card-type"></span><span class="wallet-bank-card-chip" aria-hidden="true"></span><span class="wallet-bank-card-number"></span></section><section class="wallet-overview" style="margin-top:14px"><div class="wallet-overview-label">演示可用余额</div><div class="wallet-overview-balance"></div><div class="wallet-overview-note">虚构信息 · 不代表真实银行账户</div></section><p class="wallet-demo-note">为了演示安全的卡片详情页面，仅展示虚构卡片的掩码尾号，不包含真实账户或可支付信息。</p></main>`;
          const cardView = body.querySelector(".wallet-bank-card");
          cardView.style.background = bankCardBackgrounds[index];
          cardView.querySelector(".wallet-bank-card-name").textContent = card.bank;
          cardView.querySelector(".wallet-bank-card-type").textContent = card.tier;
          cardView.querySelector(".wallet-bank-card-number").textContent = `••••　••••　••••　${card.digits}`;
          body.querySelector(".wallet-overview-balance").textContent = card.balance;
          body.querySelector(".wallet-card-back").addEventListener("click", renderOverview);
        }

        renderOverview();
      }

      function renderSimpleApp(body, id) {
        if (id === "taobao") {
          renderTaobao(body);
          return;
        }
        if (id === "xiaohongshu") {
          renderXiaohongshu(body);
          return;
        }
        if (id === "damai") {
          renderDamai(body);
          return;
        }
        if (id === "dianping") {
          renderDianping(body);
          return;
        }
        if (id === "hongguo") {
          renderHongguo(body);
          return;
        }
        if (id === "fanqie") {
          renderFanqie(body);
          return;
        }
        if (id === "xingtu") {
          renderXingtu(body);
          return;
        }
        if (id === "doubao") {
          renderDoubao(body);
          return;
        }
        if (id === "wallet") {
          renderWallet(body);
          return;
        }
        const appName = apps.find((app) => app.id === id)?.name || "应用";
        const copy = {
          calendar: ["10月", "27", "星期二　今天", "没有日程安排"],
          maps: ["地图", "📍", "探索附近", "咖啡馆　　餐厅　　加油站"],
          store: ["为你推荐", "✦", "探索精彩 App", "发现更多适合你的应用与游戏。"],
          health: ["健康", "♥", "今天", "活动圆环　　步数　　睡眠"],
          wallet: ["钱包", "▣", "卡片与凭证", "添加银行卡、交通卡或登机牌。"],
          taobao: ["淘宝", "淘", "发现喜欢的好物", "本地演示入口，未连接真实服务。"],
          douyin: ["抖音", "♫", "暂时无法登录", "账号密码已重置，请前往邮箱打开一键登录邮件。"],
          damai: ["大麦", "🎟️", "演出与活动", "本地演示入口，未连接真实服务。"],
          xingtu: ["醒图", "醒", "照片编辑", "本地演示入口，未连接真实服务。"],
          doubao: ["豆包", "豆", "智能助手", "本地聊天演示。"]
        }[id] || [appName, "✦", `欢迎使用${appName}`, "本地演示入口，未连接真实服务。"];
        body.innerHTML = `<div class="card" style="text-align:center;padding:34px 15px"><div class="muted">${copy[0]}</div><div style="font-size:68px;margin:15px">${copy[1]}</div><h2>${copy[2]}</h2><p class="muted">${copy[3]}</p>${id === "notes" ? '<textarea placeholder="开始输入…" style="width:100%;height:100px;border:0;outline:0;resize:vertical;color:#222"></textarea>' : ""}</div>`;
      }

      function startGesture(event) {
        if (!event.isPrimary || (event.pointerType === "mouse" && event.button !== 0)) return;
        if (event.target.closest("button, input, textarea, .app-view, .control-center")) return;
        swipeStart = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
        event.currentTarget.setPointerCapture(event.pointerId);
      }
      function endGesture(event) {
        if (!swipeStart || event.pointerId !== swipeStart.pointerId) return;
        const dx = event.clientX - swipeStart.x;
        const dy = event.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.2 && unlocked && homeScreen.classList.contains("active") && !appView.classList.contains("open") && !controlCenter.classList.contains("open")) {
          setHomePage(homePageIndex + (dx < 0 ? 1 : -1));
          return;
        }
        if (Math.abs(dy) < 48 || Math.abs(dy) < Math.abs(dx) * 1.2) return;
        if (dy < 0 && !unlocked) unlock();
        else if (dy < 0 && appView.classList.contains("open")) goHome();
        else if (dy < 0 && controlCenter.classList.contains("open")) controlCenter.classList.remove("open");
        else if (dy > 0 && unlocked && !appView.classList.contains("open") && !controlCenter.classList.contains("open")) controlCenter.classList.add("open");
      }
      $("#screen").addEventListener("pointerdown", startGesture);
      $("#screen").addEventListener("pointerup", endGesture);
      $("#screen").addEventListener("pointercancel", endGesture);
      lockScreen.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;
        unlock();
      });
      $("#homeIndicator").addEventListener("click", goHome);
      document.querySelectorAll(".page-dot").forEach((dot) => dot.addEventListener("click", () => setHomePage(Number(dot.dataset.page))));
      $("#island").addEventListener("click", () => $("#island").classList.toggle("expanded"));
      $("#fullscreenToggle").addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (error) {
          console.error("Unable to toggle fullscreen mode.", error);
          $("#fullscreenToggle").title = "全屏不可用；可以按 F11 切换浏览器全屏";
        }
      });
      document.addEventListener("fullscreenchange", () => {
        const fullscreen = Boolean(document.fullscreenElement);
        $("#fullscreenToggle").setAttribute("aria-label", fullscreen ? "退出全屏" : "进入全屏");
        $("#fullscreenToggle").title = fullscreen ? "退出全屏" : "进入全屏";
      });
      $("#lockCamera").addEventListener("click", () => { if (!unlocked) unlock(); openApp("camera"); });
      $("#flashlight").addEventListener("click", (event) => {
        flashlightOn = !flashlightOn;
        event.currentTarget.style.background = flashlightOn ? "#fff" : "";
        event.currentTarget.style.color = flashlightOn ? "#222" : "";
      });
      controlCenter.addEventListener("click", (event) => {
        const button = event.target.closest(".cc-button");
        if (button && button.getAttribute("aria-label")) button.classList.toggle("on");
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" || event.key === "Backspace") {
          if (appView.classList.contains("open")) closeApp();
          else if (controlCenter.classList.contains("open")) controlCenter.classList.remove("open");
        }
        if (event.key === " " && !appView.classList.contains("open")) {
          event.preventDefault();
          unlocked ? goHome() : unlock();
        }
      });
      const savedTianziLock = localStorage.getItem(wuTianziLockStorageKey);
      if (savedTianziLock !== null && Number(savedTianziLock) > Date.now()) {
        renderTianziPhoneLock(Number(savedTianziLock));
      } else if (savedTianziLock !== null) {
        localStorage.removeItem(wuTianziLockStorageKey);
      }
    })();
  </script>
</body>
</html>
